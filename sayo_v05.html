<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>SAYO · Art-preserving motion test v0.5</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e5dfe6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none} .pill{background:#ffffffdf;border:1px solid #ffffff;border-radius:15px;padding:10px 13px;color:#24212a;font-size:12px;line-height:1.45;box-shadow:0 4px 16px #2d233014}.pill b{font-size:14px;letter-spacing:.04em}#joy{position:absolute;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 35px);width:118px;height:118px;border:1px solid #b4a7b8;border-radius:50%;background:#ffffff35;touch-action:none}#nub{position:absolute;width:46px;height:46px;left:35px;top:35px;border-radius:50%;background:#d8cbd9e8;border:1px solid #9d8fa2;box-shadow:0 2px 10px #0001}#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:#ffffffd9;border:1px solid #d8ceda;border-radius:14px;padding:8px 12px;color:#4c4350;font-size:12px;white-space:nowrap;pointer-events:none}#mode{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 35px);border:1px solid #cfc4d1;background:#ffffffdc;border-radius:15px;padding:12px;color:#3c3440;font-size:12px}#mode:active{background:white}
</style></head><body><canvas id="view"></canvas><div id="top"><div class="pill"><b>SAYO · ART MOTION v0.5</b><br>원화 보존형 움직임 시험판</div><div class="pill" style="text-align:right">왼쪽 패드: 이동<br>화면 드래그: 시점 회전</div></div><div id="joy"><div id="nub"></div></div><button id="mode">걷기 모션: ON</button><div id="hint">원화의 실루엣을 유지하는 2.5D 시험판 · 실제 3D 리깅 아님</div><script>
const c=document.querySelector('#view'),ctx=c.getContext('2d'),img=new Image();img.src='sayo_art.png';let W=0,H=0,dpr=1,px=0,pz=0,yaw=0,joyX=0,joyY=0,walk=true,t=0,drag=null,lastX=0,lastY=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawGrid(){let horizon=H*.39;ctx.fillStyle='#e2dbe3';ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#fff';ctx.fillRect(0,horizon,W,H-horizon);for(let i=0;i<20;i++){let q=i/19;let y=horizon+(H-horizon)*q*q;line(0,y,W,y,'#e7e2e8',1)}for(let i=-12;i<=12;i++){let bottom=W/2+i*W/14;let top=W/2+i*W*.025;line(top,horizon,bottom,H,'#e8e3e9',1)}}
function draw(){t+=.016;ctx.clearRect(0,0,W,H);drawGrid();let scale=1/(1+Math.max(-2,Math.min(8,pz))*.035);let groundX=W*.5+px*W*.055;let groundY=H*.73-pz*H*.025;let charH=Math.min(H*.61,W*.94)*scale;let charW=charH*(img.width/img.height);let bob=walk&&Math.hypot(joyX,joyY)>.1?Math.abs(Math.sin(t*12))*5:Math.sin(t*1.6)*1.6;ctx.save();ctx.translate(groundX,groundY);ctx.fillStyle='#342c3840';ctx.beginPath();ctx.ellipse(8,2,charW*.20,charH*.025,-.1,0,Math.PI*2);ctx.fill();if(img.complete&&img.naturalWidth){ctx.translate(0,-bob);ctx.drawImage(img,-charW/2,-charH,charW,charH)}else{ctx.fillStyle='#28232b';ctx.fillRect(-20,-120,40,120)}ctx.restore();ctx.fillStyle='#4c4350';ctx.font='12px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillText(`위치 ${px.toFixed(1)}, ${pz.toFixed(1)} · ${Math.hypot(joyX,joyY)>.1?'이동 중':'대기'}`,W/2,H-105);requestAnimationFrame(draw)}requestAnimationFrame(draw);
const joy=document.querySelector('#joy'),nub=document.querySelector('#nub');function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),max=38;if(m>max){dx=dx/m*max;dy=dy/m*max}joyX=dx/max;joyY=dy/max;nub.style.left=(35+dx)+'px';nub.style.top=(35+dy)+'px'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)setJoy(e)});function reset(){joyX=joyY=0;nub.style.left='35px';nub.style.top='35px'}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);document.querySelector('#mode').onclick=()=>{walk=!walk;document.querySelector('#mode').textContent='걷기 모션: '+(walk?'ON':'OFF')};c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.008;lastX=e.clientX;lastY=e.clientY}});c.addEventListener('pointerup',()=>drag=null);c.addEventListener('pointercancel',()=>drag=null);
setInterval(()=>{if(Math.hypot(joyX,joyY)>.08){px+=joyX*.055*Math.cos(yaw)-joyY*.055*Math.sin(yaw);pz+=joyX*.055*Math.sin(yaw)+joyY*.055*Math.cos(yaw);px=Math.max(-7,Math.min(7,px));pz=Math.max(-7,Math.min(7,pz))}},16);
</script></body></html>
