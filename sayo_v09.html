<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SAYO · HAIR MOTION v0.9</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#e8e2eb;color:#302b34}
#stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#e5dfe8 0 48%,#fff 48% 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.pill{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.card{background:#ffffffed;border:1px solid #ded6e1;border-radius:18px;padding:10px 13px;box-shadow:0 4px 16px #5a4d5b10;font-size:13px;line-height:1.35}
.card b{display:block;font-size:14px;letter-spacing:.04em;margin-bottom:3px}
.controls{position:absolute;right:14px;bottom:20px;display:flex;flex-direction:column;gap:9px;width:156px}
button{border:1px solid #cfc4d2;background:#ffffffeb;color:#39313d;border-radius:16px;padding:12px 10px;font-size:14px;box-shadow:0 3px 10px #44394b12}
button:active{transform:scale(.98)}
.note{position:absolute;left:12px;bottom:22px;max-width:calc(100% - 190px);font-size:11px;line-height:1.35;color:#655b69;background:#ffffffd9;border-radius:12px;padding:8px 10px}
@media(min-width:700px){.card{font-size:15px}.controls{width:190px}.note{font-size:13px}}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div class="pill">
  <div class="card"><b>SAYO · HAIR MOTION v0.9</b>대머리 베이스 + 머리카락 흔들림 테스트</div>
  <div class="card" style="text-align:right">긴 가닥은 크게<br>뿌리는 작게 흔들림</div>
</div>
<div class="controls">
  <button id="toggle">머리카락 흔들림: ON</button>
  <button id="power">움직임 강도: 강하게</button>
  <button id="reset">흔들림 초기화</button>
</div>
<div class="note">베이스는 새로 올린 이미지 사용 · 머리카락은 기존 투명 PNG 파츠를 겹친 시험판</div>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const base=new Image(); base.src='sayo_base.png';
const manifestFetch=fetch('hair_manifest.json').then(r=>r.json());
let parts=[], enabled=true, strong=true, t0=performance.now(), last=0, W=0,H=0,dpr=1;
const TAU=Math.PI*2;
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth; H=window.innerHeight;
 canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();
Promise.all([manifestFetch]).then(async ([data])=>{
 parts=await Promise.all(data.map(async (m,i)=>{
   const im=new Image(); im.src='hair_parts/'+m.file;
   try{await im.decode()}catch(e){}
   return {...m,img:im,idx:i};
 }));
 requestAnimationFrame(draw);
}).catch(()=>requestAnimationFrame(draw));

function draw(now=performance.now()){
 const dt=Math.min(40,now-last||16); last=now;
 ctx.clearRect(0,0,W,H);
 // Fit base art as a full portrait, preserving the original aspect ratio.
 const scale=Math.min(W/1086,H/1448);
 const bw=1086*scale,bh=1448*scale;
 const bx=(W-bw)/2, by=(H-bh)/2+8;
 // Soft floor/grid
 ctx.fillStyle='#e7e0e9';ctx.fillRect(0,0,W,H*0.49);
 ctx.fillStyle='#fff';ctx.fillRect(0,H*0.49,W,H*0.51);
 ctx.strokeStyle='#e8e2eb';ctx.lineWidth=1;
 for(let i=-10;i<=10;i++){
   ctx.beginPath();ctx.moveTo(W/2+i*W/12,H*0.49);ctx.lineTo(W/2+i*W/3,H);ctx.stroke();
 }
 for(let j=0;j<12;j++){let y=H*.49+(j/11)*(H*.51);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 if(base.complete&&base.naturalWidth){
   ctx.drawImage(base,bx,by,bw,bh);
 }
 // Hair parts are positioned from the old full-body artwork; scale them down to match
 // the new bald base's smaller head while keeping the head crown near the top.
 const hairScale=scale*0.56;
 const anchorOldX=510, anchorOldY=110;
 const anchorNewX=bx+bw*(510/1086), anchorNewY=by+bh*(110/1448);
 const elapsed=(now-t0)/1000;
 for(const p of parts){
   if(!p.img||!p.img.complete||!p.img.naturalWidth) continue;
   const localX=(p.x-anchorOldX)*hairScale;
   const localY=(p.y-anchorOldY)*hairScale;
   const w=p.width*hairScale,h=p.height*hairScale;
   const pivotX=anchorNewX+localX+(p.pivot[0]-p.x)*hairScale;
   const pivotY=anchorNewY+localY+(p.pivot[1]-p.y)*hairScale;
   // Make long tips visibly swing more than the roots. Angle in radians.
   const isLong=/outer|inner|flyaway|front_lock|04L|04R|12_|11_/.test(p.name);
   const isRoot=/crown|bangs|head_sweep|ribbon/.test(p.name);
   let amp= isRoot ? 0.012 : (isLong ? (strong?0.095:0.045) : (strong?0.045:0.022));
   if(/flyaway/.test(p.name)) amp*=1.25;
   const freq=0.85+(p.idx%5)*0.12;
   const phase=(p.phase||0)+(p.idx*0.61);
   const angle=enabled ? Math.sin(elapsed*freq+phase)*amp : 0;
   const sway=enabled ? Math.sin(elapsed*(freq*.72)+phase+1.2)*(isLong?(strong?3.2:1.4):0.8)*scale : 0;
   ctx.save();
   ctx.translate(pivotX+sway,pivotY);
   ctx.rotate(angle);
   ctx.drawImage(p.img,-(p.pivot[0]-p.x)*hairScale,-(p.pivot[1]-p.y)*hairScale,w,h);
   ctx.restore();
 }
 requestAnimationFrame(draw);
}
document.getElementById('toggle').onclick=()=>{enabled=!enabled;document.getElementById('toggle').textContent='머리카락 흔들림: '+(enabled?'ON':'OFF')};
document.getElementById('power').onclick=()=>{strong=!strong;document.getElementById('power').textContent='움직임 강도: '+(strong?'강하게':'보통')};
document.getElementById('reset').onclick=()=>{t0=performance.now()};
</script>
</body></html>
